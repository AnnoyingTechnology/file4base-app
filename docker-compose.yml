# Credentials and network exposure are configurable through a `.env` file next
# to this file (see `.env.example`). The fallback values are for local
# development only: set POSTGRES_PASSWORD before exposing the stack to a network.
services:
  # Primary Database Engine: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: file4base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: file4base
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      # Published on the loopback interface only by default
      - "${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file4base -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - file4base-net

  # Alternative Engine Profile: MariaDB (start with: docker compose --profile mariadb up)
  mariadb:
    image: mariadb:11-jammy
    container_name: file4base-mariadb
    restart: unless-stopped
    profiles: ["mariadb"]
    environment:
      MARIADB_DATABASE: mysql
      MARIADB_USER: file4base
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-dev_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - file4base-net

  # Go Backend Core API Service (file4base-api)
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: file4base-api
    container_name: file4base-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_ENGINE: "postgres"
      # POSTGRES_PASSWORD is embedded in a URL: percent-encode special characters
      DATABASE_URL: "postgres://file4base:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/postgres?sslmode=disable"
      SERVER_PORT: ":8080"
      # Idle lifetime of a signed-in session
      SESSION_TTL: "${SESSION_TTL:-12h}"
      # Browser origins allowed to call the API directly (comma-separated, or *)
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      # Set to "false" so that only a signed-in owner can create databases
      ALLOW_PUBLIC_DATABASE_CREATION: "${ALLOW_PUBLIC_DATABASE_CREATION:-true}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      file4base-net:
        aliases:
          - api
          - server
          - file4base-api

  # WebDirect Client (Web UI served when launched as a Server via docker compose)
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: file4base-app-web
    container_name: file4base-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - file4base-net

volumes:
  postgres_data:
    name: file4base-postgres-data
  mariadb_data:
    name: file4base-mariadb-data

networks:
  file4base-net:
    name: file4base-net
    driver: bridge
